# HTTPS in front of the Hub and Navidrome. Run together with the ordinary compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --no-build --no-deps hub navidrome caddy-https
#   ./gateway/local/make-cert.sh
#   ./gateway/local/use-le.sh cert.pem key.pem
#
# The Hub and Navidrome have no host ports any more: only Caddy publishes them.
# The old numbers stay the same, now HTTPS: 8080 Hub (router 8445 leads here),
# 4533 Navidrome (router 8444 leads here).
services:
  hub:
    # Caddy reaches hub:8080 over the compose network; nothing else needs it on the host.
    ports: !reset []

  navidrome:
    # Caddy reaches navidrome:4533 over the compose network.
    ports: !reset []

  caddy-https:
    image: caddy:2.8.4-alpine
    container_name: homemusic_caddy
    restart: unless-stopped
    # Some Ubuntu hosts cannot load the docker-default AppArmor profile for new containers.
    security_opt:
      - apparmor=unconfined
    ports:
      - "8080:8080"
      - "4533:4533"
    environment:
      HUB_IP: ${HTTPS_HUB_IP:-192.168.50.107}
      HUB_NAME: ${HTTPS_HUB_NAME:-music.example.local}
      PUBLIC_HOST: ${HTTPS_PUBLIC_HOST:-glvservice.asuscomm.com}
    volumes:
      - ./gateway/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gateway/local/certs:/etc/caddy/certs:ro
      - caddy-https-data:/data
      - caddy-https-config:/config
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  caddy-https-data:
  caddy-https-config:
