# HomeMusic: Navidrome (library + streaming) + Hub (search, downloads, uploads, AI) + reverse SSH tunnel to the VPS.
# Target: Ubuntu 24.04 + Docker Engine (Compose v2). Windows/Docker Desktop still works, see README.
# Start / update:  docker compose up -d --build        Stop: docker compose down
# Settings come from .env (copy .env.example). MUSIC_ROOT is a Linux folder, e.g. /srv/music.
# Optional services are enabled in .env with COMPOSE_PROFILES: "embedder" (audio vectors), "vps" (tunnel),
# or "embedder,vps" for both.
name: homemusic

x-logging: &logging
  driver: local
  options:
    max-size: "5m"
    max-file: "3"

services:
  navidrome:
    image: deluan/navidrome:0.64.2
    container_name: homemusic_navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_CONFIGFILE: /config/navidrome.toml
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_DEFAULTLANGUAGE: ru
      ND_LASTFM_LANGUAGE: ru  # artist bios from Last.fm in Russian where they exist
      # inotify works on a native Linux bind mount; the Hub still calls startScan after every import
      ND_SCANSCHEDULE: 1h
      ND_SCANNER_WATCHERENABLED: "true"
      ND_AUTOIMPORTPLAYLISTS: "false"
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_ENABLESHARING: "true"
      ND_LOGLEVEL: info
      # the Hub links its files to Navidrome song ids by path
      ND_SUBSONIC_DEFAULTREPORTREALPATH: "true"
      ND_BACKUP_PATH: /backups
      ND_BACKUP_SCHEDULE: "30 4 * * *"
      ND_BACKUP_COUNT: "7"
      ND_PASSWORDENCRYPTIONKEY: ${ND_PASSWORDENCRYPTIONKEY:?set ND_PASSWORDENCRYPTIONKEY in .env}
    volumes:
      - navidrome-data:/data
      - ./navidrome/navidrome.toml:/config/navidrome.toml:ro
      - ${MUSIC_ROOT:?set MUSIC_ROOT in .env}/library:/music:ro
      # Navidrome may run as uid 1000; the installer makes this folder writable for it (root can write anyway)
      - ${MUSIC_ROOT}/.backups/navidrome:/backups
    logging: *logging

  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    image: homemusic-hub:local
    container_name: homemusic_hub
    restart: unless-stopped
    depends_on:
      navidrome:
        condition: service_started
      youtube-pot:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MUSIC_ROOT: /music
      DATA_DIR: /data
      CONFIG_FILE: /config/config.yaml
      NAVIDROME_URL: http://navidrome:4533
      YTDLP_POT_BASE_URL: http://youtube-pot:4416
      YTDLP_CACHE_DIR: /data/yt-dlp-cache
    # makes the LLM_BASE_URL=http://host.docker.internal:11434/v1 fallback (local Ollama) work on Linux too
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hub-data:/data
      - ${MUSIC_ROOT}:/music
      - ./config.yaml:/config/config.yaml:ro
      - soulseek-downloads:/soulseek-downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging

  # PO tokens for the YouTube clients yt-dlp asks as. Internal only: no host port or cookie/music mounts.
  # Keep the image version in sync with bgutil-ytdlp-pot-provider in hub/pyproject.toml.
  youtube-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    container_name: homemusic_youtube_pot
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "4416"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  # Soulseek daemon, only with COMPOSE_PROFILES=soulseek (.env). The Hub talks to it over the compose network
  # (SLSKD_API_KEY) and takes finished files from the shared volume, removing them after the import.
  slskd:
    image: slskd/slskd:0.26.2
    profiles: [soulseek]
    restart: unless-stopped
    environment:
      SLSKD_SLSK_USERNAME: ${SLSKD_SLSK_USERNAME:-}
      SLSKD_SLSK_PASSWORD: ${SLSKD_SLSK_PASSWORD:-}
      SLSKD_SLSK_PORT: ${SLSKD_SLSK_PORT:-2271}
      SLSKD_SLSK_CONNECTION_TIMEOUT: ${SLSKD_SLSK_CONNECTION_TIMEOUT:-5000}
      SLSKD_API_KEY: "role=ReadWrite;${SLSKD_API_KEY:-}"
      SLSKD_DOWNLOADS_DIR: /downloads
    expose:
      - "5030"
    volumes:
      - slskd-data:/app
      - soulseek-downloads:/downloads
    logging: *logging

  # Audio/text vectors (MuQ-MuLan) for mixes and «Моя волна» — MIXES.md, section 4.2. Only the compose network
  # reaches it (no published port): the Hub calls http://embedder:8090 (EMBEDDER_URL).
  # Enabled with COMPOSE_PROFILES=embedder. CPU by default; GPU acceleration is in docker-compose.gpu.yml.
  embedder:
    build: ./embedder
    image: homemusic-embedder:local
    container_name: homemusic_embedder
    profiles: ["embedder"]
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      EMBEDDER_TOKEN: ${EMBEDDER_TOKEN:-}
      EMBEDDER_DEVICE: ${EMBEDDER_DEVICE:-cpu}
      DATA_DIR: /data
      MODELS_DIR: /models
      HF_HOME: /models/hf
      MUSIC_ROOT: /music
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - embedder-data:/data
      # weights (~3 GB) are downloaded on the first job and kept here, not in the image
      - embedder-models:/models
      - ${MUSIC_ROOT}/library:/music:ro
    # loading the model onto the GPU peaks at ~3.4 GB (with the checkpoint's page cache), working ~2.5 GB.
    # CPU needs ~6-7 GB: use 7g on an 8 GB host, 8g on 16+ GB (the installer picks it).
    mem_limit: ${EMBEDDER_MEM_LIMIT:-8g}
    memswap_limit: ${EMBEDDER_MEM_LIMIT:-8g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging

  # Reverse SSH tunnel: the VPS listens on 127.0.0.1:4533 / 127.0.0.1:8080 and Caddy serves them over HTTPS.
  # The tunnel key only allows these two remote listens. Enabled with COMPOSE_PROFILES=vps.
  tunnel:
    profiles: ["tunnel"]  # only for a home behind a VPS: COMPOSE_PROFILES=tunnel in .env
    build: ./gateway/tunnel
    image: homemusic-tunnel:local
    container_name: homemusic_tunnel
    profiles: ["vps"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=1m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      VPS_HOST: ${VPS_HOST:?set VPS_HOST in .env}
      VPS_PORT: "22"
      VPS_USER: homemusic-tunnel
      FORWARDS: "127.0.0.1:4533:navidrome:4533 127.0.0.1:8080:hub:8080"
      RETRY_DELAY: "10"
      HOME: /tmp
    volumes:
      - ./gateway/tunnel/tunnel_key:/config/tunnel_key:ro
      - ./gateway/tunnel/known_hosts:/config/known_hosts:ro
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "3"

  # A home with a public static IP: Caddy here serves the Hub over HTTPS at PUBLIC_DOMAIN (gateway/direct/Caddyfile).
  # COMPOSE_PROFILES=direct in .env; the router forwards 80 and 443 to this computer.
  caddy:
    profiles: ["direct"]
    image: caddy:2.8.4-alpine
    container_name: homemusic_caddy
    restart: unless-stopped
    depends_on:
      - hub
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./gateway/direct/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  # SQLite databases and model weights live on the Docker volume (native Linux filesystem), not on a bind mount:
  # locking/WAL are unreliable on network and Windows/FAT mounts. The Hub copies daily backups of both into
  # MUSIC_ROOT/.backups.
  navidrome-data:
  hub-data:
  embedder-data:
  embedder-models:
  slskd-data:
  soulseek-downloads:
